<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KDT Resource — Admin Dashboard</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0f1a; font-family: 'Inter', sans-serif; color: #e2e8f0; min-height: 100vh; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    @keyframes slideIn { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0a0f1a; }
    ::-webkit-scrollbar-thumb { background: #1D9E75; border-radius: 3px; }
    input { color: #ffffff !important; background: #1a2535 !important; }
    input::placeholder { color: #475569 !important; }
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus {
      -webkit-text-fill-color: #ffffff !important;
      -webkit-box-shadow: 0 0 0px 1000px #1a2535 inset !important;
      transition: background-color 5000s ease-in-out 0s;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const API_BASE = "http://localhost:4000/api";

    function AdminApp() {
      const [token, setToken] = React.useState("");
      const [username, setUsername] = React.useState("");
      const [password, setPassword] = React.useState("");
      const [error, setError] = React.useState("");
      const [loading, setLoading] = React.useState(false);
      const [activeTab, setActiveTab] = React.useState("results");

      // Data
      const [results, setResults] = React.useState([]);
      const [users, setUsers] = React.useState([]);
      const [lastRefresh, setLastRefresh] = React.useState(null);
      const [resetting, setResetting] = React.useState(false);
      const [resetConfirm, setResetConfirm] = React.useState(false);
      const [toast, setToast] = React.useState("");

      React.useEffect(() => {
        if (token) {
          fetchAll();
          const interval = setInterval(fetchAll, 10000);
          return () => clearInterval(interval);
        }
      }, [token]);

      const fetchAll = async () => {
        await Promise.all([fetchResults(), fetchUsers()]);
        setLastRefresh(new Date());
      };

      const fetchResults = async () => {
        try {
          const res = await fetch(`${API_BASE}/admin/results`, {
            headers: { Authorization: token }
          });
          if (res.status === 403) { handleLogout(); return; }
          const data = await res.json();
          setResults(data);
        } catch (err) {
          console.error("Failed to fetch results");
        }
      };

      const fetchUsers = async () => {
        try {
          const res = await fetch(`${API_BASE}/admin/users`, {
            headers: { Authorization: token }
          });
          const data = await res.json();
          setUsers(data);
        } catch (err) {
          console.error("Failed to fetch users");
        }
      };

      const handleLogin = async () => {
        setError("");
        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/auth/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
          });
          const data = await res.json();
          if (!res.ok) { setError(data.message); setLoading(false); return; }

          // Verify admin role
          const verify = await fetch(`${API_BASE}/admin/results`, {
            headers: { Authorization: data.token }
          });
          if (verify.status === 403) {
            setError("Access denied — admin accounts only");
            setLoading(false);
            return;
          }

          setToken(data.token);
        } catch (err) {
          setError("Connection failed — is the server running?");
        }
        setLoading(false);
      };

      const handleLogout = () => {
        setToken("");
        setResults([]);
        setUsers([]);
      };

      const handleReset = async () => {
        if (!resetConfirm) { setResetConfirm(true); return; }
        setResetting(true);
        try {
          const res = await fetch(`${API_BASE}/admin/reset`, {
            method: "POST",
            headers: { Authorization: token }
          });
          const data = await res.json();
          showToast("✅ " + data.message);
          fetchAll();
        } catch (err) {
          showToast("❌ Reset failed");
        }
        setResetting(false);
        setResetConfirm(false);
      };

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(""), 3000);
      };

      const totalVotes = results.reduce((sum, c) => sum + c.votes, 0);
      const totalVoters = users.filter(u => u.votes && u.votes.length > 0).length;
      const maxVotes = results.length > 0 ? results[0].votes : 1;

      const countryFlags = {
        Argentina: "🇦🇷", Brazil: "🇧🇷", Uruguay: "🇺🇾", Colombia: "🇨🇴",
        Ecuador: "🇪🇨", Venezuela: "🇻🇪", Paraguay: "🇵🇾", Bolivia: "🇧🇴",
        Chile: "🇨🇱", Peru: "🇵🇪", England: "🇬🇧", France: "🇫🇷",
        Germany: "🇩🇪", Spain: "🇪🇸", Portugal: "🇵🇹", Netherlands: "🇳🇱",
        Belgium: "🇧🇪", Croatia: "🇭🇷", Italy: "🇮🇹", Switzerland: "🇨🇭",
        Denmark: "🇩🇰", Austria: "🇦🇹", Serbia: "🇷🇸", Turkey: "🇹🇷",
        Ukraine: "🇺🇦", Poland: "🇵🇱", Morocco: "🇲🇦", Senegal: "🇸🇳",
        Nigeria: "🇳🇬", Egypt: "🇪🇬", Algeria: "🇩🇿", "Ivory Coast": "🇨🇮",
        Cameroon: "🇨🇲", "South Africa": "🇿🇦", Mali: "🇲🇱", Tunisia: "🇹🇳",
        Ghana: "🇬🇭", "United States": "🇺🇸", Mexico: "🇲🇽", Canada: "🇨🇦",
        "Costa Rica": "🇨🇷", Japan: "🇯🇵", "South Korea": "🇰🇷",
        "Saudi Arabia": "🇸🇦", Australia: "🇦🇺", Iran: "🇮🇷",
        Iraq: "🇮🇶", "New Zealand": "🇳🇿"
      };

      // ─── LOGIN SCREEN ───────────────────────────────────────────
      if (!token) return (
        <div style={{
          minHeight: "100vh", display: "flex", alignItems: "center",
          justifyContent: "center", background: "linear-gradient(135deg, #0a0f1a 0%, #0d1f14 100%)"
        }}>
          <div style={{
            width: "100%", maxWidth: "420px", padding: "24px",
            animation: "slideIn 0.4s ease-out"
          }}>
            {/* Logo */}
            <div style={{ textAlign: "center", marginBottom: "40px" }}>
              <svg viewBox="100 30 480 300" xmlns="http://www.w3.org/2000/svg" style={{ width: "200px", height: "auto" }}>
                <rect x="100" y="30" width="480" height="300" rx="18" fill="rgba(29,158,117,0.06)"/>
                <rect x="152" y="95" width="13" height="130" rx="2" fill="#1D9E75"/>
                <polygon points="165,95 165,160 217,95 233,95 181,160 165,160" fill="#1D9E75"/>
                <polygon points="165,160 165,225 181,160 233,225 217,225" fill="#0F6E56"/>
                <polygon points="181,160 199,147 199,173" fill="#5DCAA5" opacity="0.75"/>
                <text x="256" y="145" fontFamily="Georgia, serif" fontSize="52" fontWeight="700" dominantBaseline="middle" fill="#ffffff">kdt</text>
                <rect x="256" y="172" width="270" height="1.5" rx="1" fill="#1D9E75" opacity="0.4"/>
                <text x="258" y="194" fontFamily="'Courier New', monospace" fontSize="15.5" letterSpacing="5" dominantBaseline="middle" fill="#5DCAA5">resource</text>
                <text x="258" y="233" fontFamily="Georgia, serif" fontSize="13.5" fontStyle="italic" dominantBaseline="middle" fill="#1D9E75">Powering Your Digital World</text>
                <circle cx="248" cy="233" r="3" fill="#5DCAA5" opacity="0.85"/>
              </svg>
              <div style={{
                display: "inline-flex", alignItems: "center", gap: "6px",
                background: "rgba(29,158,117,0.12)", border: "1px solid rgba(29,158,117,0.3)",
                borderRadius: "20px", padding: "4px 14px", marginTop: "12px"
              }}>
                <div style={{ width: "6px", height: "6px", borderRadius: "50%", background: "#1D9E75", animation: "pulse 2s infinite" }}></div>
                <span style={{ fontSize: "11px", color: "#1D9E75", fontWeight: "600", letterSpacing: "1px", textTransform: "uppercase" }}>Admin Access</span>
              </div>
            </div>

            {/* Login Card */}
            <div style={{
              background: "rgba(255,255,255,0.03)", border: "1px solid rgba(255,255,255,0.08)",
              borderRadius: "16px", padding: "32px"
            }}>
              <h2 style={{ fontSize: "20px", fontWeight: "700", marginBottom: "6px", color: "#fff" }}>Command Centre</h2>
              <p style={{ fontSize: "13px", color: "#64748b", marginBottom: "28px" }}>Authorised personnel only</p>

              {error && (
                <div style={{
                  background: "rgba(239,68,68,0.1)", border: "1px solid rgba(239,68,68,0.3)",
                  borderRadius: "8px", padding: "12px 16px", marginBottom: "20px",
                  fontSize: "13px", color: "#fca5a5"
                }}>{error}</div>
              )}

              <div style={{ marginBottom: "16px" }}>
                <label style={{ fontSize: "12px", fontWeight: "600", color: "#94a3b8", letterSpacing: "0.5px", textTransform: "uppercase", display: "block", marginBottom: "8px" }}>Username</label>
                <input
                  type="text"
                  value={username}
                  onChange={e => setUsername(e.target.value)}
                  onKeyDown={e => e.key === "Enter" && handleLogin()}
                  placeholder="admin username"
                  style={{
                    width: "100%", padding: "12px 16px", background: "rgba(255,255,255,0.05)",
                    border: "1px solid rgba(255,255,255,0.1)", borderRadius: "8px",
                    color: "#fff", fontSize: "14px", outline: "none", fontFamily: "'JetBrains Mono', monospace"
                  }}
                />
              </div>

              <div style={{ marginBottom: "24px" }}>
                <label style={{ fontSize: "12px", fontWeight: "600", color: "#94a3b8", letterSpacing: "0.5px", textTransform: "uppercase", display: "block", marginBottom: "8px" }}>Password</label>
                <input
                  type="password"
                  value={password}
                  onChange={e => setPassword(e.target.value)}
                  onKeyDown={e => e.key === "Enter" && handleLogin()}
                  placeholder="••••••••"
                  style={{
                    width: "100%", padding: "12px 16px", background: "rgba(255,255,255,0.05)",
                    border: "1px solid rgba(255,255,255,0.1)", borderRadius: "8px",
                    color: "#fff", fontSize: "14px", outline: "none", fontFamily: "'JetBrains Mono', monospace"
                  }}
                />
              </div>

              <button
                onClick={handleLogin}
                disabled={loading}
                style={{
                  width: "100%", padding: "14px",
                  background: loading ? "rgba(29,158,117,0.4)" : "linear-gradient(135deg, #1D9E75, #0F6E56)",
                  border: "none", borderRadius: "8px", color: "#fff",
                  fontSize: "14px", fontWeight: "700", cursor: loading ? "not-allowed" : "pointer",
                  letterSpacing: "0.5px", textTransform: "uppercase"
                }}
              >
                {loading ? "Verifying..." : "Enter Dashboard"}
              </button>
            </div>
          </div>
        </div>
      );

      // ─── DASHBOARD ───────────────────────────────────────────────
      return (
        <div style={{ minHeight: "100vh", background: "#0a0f1a" }}>

          {/* Top Nav */}
          <div style={{
            background: "rgba(255,255,255,0.02)", borderBottom: "1px solid rgba(255,255,255,0.06)",
            padding: "0 32px", display: "flex", alignItems: "center", justifyContent: "space-between", height: "60px"
          }}>
            <div style={{ display: "flex", alignItems: "center", gap: "12px" }}>
              <svg viewBox="100 30 480 300" xmlns="http://www.w3.org/2000/svg" style={{ width: "90px", height: "auto" }}>
                <rect x="152" y="95" width="13" height="130" rx="2" fill="#1D9E75"/>
                <polygon points="165,95 165,160 217,95 233,95 181,160 165,160" fill="#1D9E75"/>
                <polygon points="165,160 165,225 181,160 233,225 217,225" fill="#0F6E56"/>
                <polygon points="181,160 199,147 199,173" fill="#5DCAA5" opacity="0.75"/>
                <text x="256" y="145" fontFamily="Georgia, serif" fontSize="52" fontWeight="700" dominantBaseline="middle" fill="#ffffff">kdt</text>
                <rect x="256" y="172" width="270" height="1.5" rx="1" fill="#1D9E75" opacity="0.4"/>
                <text x="258" y="194" fontFamily="'Courier New', monospace" fontSize="15.5" letterSpacing="5" dominantBaseline="middle" fill="#5DCAA5">resource</text>
              </svg>
              <div style={{ width: "1px", height: "24px", background: "rgba(255,255,255,0.1)" }}></div>
              <span style={{ fontSize: "13px", color: "#64748b", fontWeight: "500" }}>Admin Dashboard</span>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: "16px" }}>
              {lastRefresh && (
                <span style={{ fontSize: "11px", color: "#334155", fontFamily: "'JetBrains Mono', monospace" }}>
                  Last sync: {lastRefresh.toLocaleTimeString()}
                </span>
              )}
              <div style={{ display: "flex", alignItems: "center", gap: "6px" }}>
                <div style={{ width: "6px", height: "6px", borderRadius: "50%", background: "#1D9E75", animation: "pulse 2s infinite" }}></div>
                <span style={{ fontSize: "11px", color: "#1D9E75", fontWeight: "600" }}>LIVE</span>
              </div>
              <button
                onClick={handleLogout}
                style={{
                  padding: "6px 14px", background: "rgba(239,68,68,0.1)", border: "1px solid rgba(239,68,68,0.2)",
                  borderRadius: "6px", color: "#fca5a5", fontSize: "12px", fontWeight: "600", cursor: "pointer"
                }}
              >Logout</button>
            </div>
          </div>

          <div style={{ padding: "32px", maxWidth: "1400px", margin: "0 auto" }}>

            {/* Stats Row */}
            <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: "16px", marginBottom: "32px" }}>
              {[
                { label: "Total Votes Cast", value: totalVotes, color: "#1D9E75" },
                { label: "Active Voters", value: totalVoters, color: "#3b82f6" },
                { label: "Registered Users", value: users.length, color: "#8b5cf6" },
                { label: "Countries", value: results.length, color: "#f59e0b" }
              ].map(stat => (
                <div key={stat.label} style={{
                  background: "rgba(255,255,255,0.03)", border: "1px solid rgba(255,255,255,0.07)",
                  borderRadius: "12px", padding: "20px 24px"
                }}>
                  <div style={{ fontSize: "28px", fontWeight: "800", color: stat.color, fontFamily: "'JetBrains Mono', monospace" }}>{stat.value}</div>
                  <div style={{ fontSize: "12px", color: "#64748b", marginTop: "4px", fontWeight: "500", textTransform: "uppercase", letterSpacing: "0.5px" }}>{stat.label}</div>
                </div>
              ))}
            </div>

            {/* Tabs */}
            <div style={{ display: "flex", gap: "4px", marginBottom: "24px", background: "rgba(255,255,255,0.03)", borderRadius: "10px", padding: "4px", width: "fit-content" }}>
              {[
                { id: "results", label: "📊 Vote Results" },
                { id: "users", label: "👥 User Activity" }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  style={{
                    padding: "8px 20px", borderRadius: "7px", border: "none", cursor: "pointer",
                    fontSize: "13px", fontWeight: "600",
                    background: activeTab === tab.id ? "rgba(29,158,117,0.2)" : "transparent",
                    color: activeTab === tab.id ? "#1D9E75" : "#64748b",
                    transition: "all 0.2s"
                  }}
                >{tab.label}</button>
              ))}
            </div>

            {/* Results Tab */}
            {activeTab === "results" && (
              <div>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "20px" }}>
                  <h2 style={{ fontSize: "18px", fontWeight: "700", color: "#fff" }}>All Countries — Live Vote Count</h2>
                  <button
                    onClick={handleReset}
                    disabled={resetting}
                    style={{
                      padding: "8px 18px",
                      background: resetConfirm ? "rgba(239,68,68,0.2)" : "rgba(255,255,255,0.05)",
                      border: resetConfirm ? "1px solid rgba(239,68,68,0.4)" : "1px solid rgba(255,255,255,0.1)",
                      borderRadius: "8px", color: resetConfirm ? "#fca5a5" : "#94a3b8",
                      fontSize: "13px", fontWeight: "600", cursor: "pointer"
                    }}
                  >
                    {resetConfirm ? "⚠️ Confirm Reset All Votes?" : "🔄 Reset Votes"}
                  </button>
                </div>

                <div style={{ display: "grid", gap: "8px" }}>
                  {results.map((country, i) => {
                    const pct = maxVotes > 0 ? (country.votes / maxVotes) * 100 : 0;
                    const medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : null;
                    return (
                      <div key={country._id} style={{
                        background: "rgba(255,255,255,0.03)", border: "1px solid rgba(255,255,255,0.06)",
                        borderRadius: "10px", padding: "14px 20px",
                        display: "grid", gridTemplateColumns: "32px 36px 180px 1fr 80px",
                        alignItems: "center", gap: "12px"
                      }}>
                        <span style={{ fontSize: "13px", color: "#334155", fontFamily: "'JetBrains Mono', monospace", fontWeight: "600" }}>#{i + 1}</span>
                        <span style={{ fontSize: "24px" }}>{medal || countryFlags[country.name] || "🏳️"}</span>
                        <span style={{ fontSize: "14px", fontWeight: "600", color: "#e2e8f0" }}>
                          {!medal && ""}{country.name}
                          {medal && <span style={{ marginLeft: "8px" }}>{countryFlags[country.name]}</span>}
                        </span>
                        <div style={{ background: "rgba(255,255,255,0.05)", borderRadius: "4px", height: "8px", overflow: "hidden" }}>
                          <div style={{
                            height: "100%", borderRadius: "4px",
                            width: `${pct}%`,
                            background: i === 0 ? "linear-gradient(90deg, #f59e0b, #fbbf24)"
                              : i === 1 ? "linear-gradient(90deg, #94a3b8, #cbd5e1)"
                              : i === 2 ? "linear-gradient(90deg, #b45309, #d97706)"
                              : "linear-gradient(90deg, #1D9E75, #5DCAA5)",
                            transition: "width 0.5s ease"
                          }}></div>
                        </div>
                        <span style={{ fontSize: "14px", fontWeight: "700", color: "#1D9E75", fontFamily: "'JetBrains Mono', monospace", textAlign: "right" }}>
                          {country.votes} {country.votes === 1 ? "vote" : "votes"}
                        </span>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* Users Tab */}
            {activeTab === "users" && (
              <div>
                <h2 style={{ fontSize: "18px", fontWeight: "700", color: "#fff", marginBottom: "20px" }}>User Activity</h2>
                <div style={{ display: "grid", gap: "8px" }}>
                  {users.map(user => (
                    <div key={user._id} style={{
                      background: "rgba(255,255,255,0.03)", border: "1px solid rgba(255,255,255,0.06)",
                      borderRadius: "10px", padding: "16px 20px",
                      display: "flex", alignItems: "center", justifyContent: "space-between"
                    }}>
                      <div style={{ display: "flex", alignItems: "center", gap: "14px" }}>
                        <div style={{
                          width: "36px", height: "36px", borderRadius: "8px",
                          background: user.role === "admin" ? "rgba(29,158,117,0.2)" : "rgba(255,255,255,0.05)",
                          display: "flex", alignItems: "center", justifyContent: "center",
                          fontSize: "16px"
                        }}>
                          {user.role === "admin" ? "👑" : "👤"}
                        </div>
                        <div>
                          <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
                            <span style={{ fontSize: "14px", fontWeight: "600", color: "#e2e8f0", fontFamily: "'JetBrains Mono', monospace" }}>{user.username}</span>
                            {user.role === "admin" && (
                              <span style={{
                                fontSize: "10px", fontWeight: "700", color: "#1D9E75",
                                background: "rgba(29,158,117,0.15)", border: "1px solid rgba(29,158,117,0.3)",
                                borderRadius: "4px", padding: "1px 6px", textTransform: "uppercase", letterSpacing: "0.5px"
                              }}>Admin</span>
                            )}
                          </div>
                          <div style={{ fontSize: "12px", color: "#475569", marginTop: "2px" }}>
                            {user.votes && user.votes.length > 0
                              ? `Voted for: ${user.votes.map(v => `${countryFlags[v.name] || "🏳️"} ${v.name}`).join(" · ")}`
                              : "No votes cast yet"
                            }
                          </div>
                        </div>
                      </div>
                      <div style={{
                        fontSize: "13px", fontWeight: "700",
                        color: user.votes && user.votes.length > 0 ? "#1D9E75" : "#334155",
                        fontFamily: "'JetBrains Mono', monospace"
                      }}>
                        {user.votes ? user.votes.length : 0}/3 votes
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>

          {/* Toast */}
          {toast && (
            <div style={{
              position: "fixed", bottom: "24px", right: "24px",
              background: "#1e293b", border: "1px solid rgba(255,255,255,0.1)",
              borderRadius: "10px", padding: "14px 20px",
              fontSize: "13px", fontWeight: "600", color: "#e2e8f0",
              boxShadow: "0 8px 32px rgba(0,0,0,0.4)", animation: "slideIn 0.3s ease-out"
            }}>{toast}</div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<AdminApp />);
  </script>
</body>
</html>
